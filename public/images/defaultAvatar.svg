<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a1a"/>
  
  <!-- Circle background for avatar -->
  <circle cx="100" cy="60" r="35" fill="#cd6931" opacity="0.2"/>
  
  <!-- User icon (generic profile) -->
  <circle cx="100" cy="55" r="20" fill="#cd6931"/>
  <ellipse cx="100" cy="120" rx="40" ry="35" fill="#cd6931"/>
  
  <!-- Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#cd6931" stroke-width="2" opacity="0.5"/>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle" font-weight="bold">SEM AVATAR</text>
</svg>